<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página no encontrada | Carlos Pérez</title>
  <script>
    (function () {
      var path = window.location.pathname;
      var aliases = { '/talks': '/ideas/', '/talks/': '/ideas/', '/articles': '/ideas/', '/articles/': '/ideas/' };
      var target = aliases[path];
      if (!target && /^\/(history|projects|ideas|contact|article\/rpki-ghost)$/.test(path)) {
        target = path + '/';
      }
      if (target) window.location.replace(target + window.location.search + window.location.hash);
    }());
  </script>
</head>
<body>
  <main>
    <h1>Página no encontrada</h1>
    <p>La dirección solicitada no está disponible. <a href="/">Volver al inicio</a>.</p>
  </main>
</body>
</html>
